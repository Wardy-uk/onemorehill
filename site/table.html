<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every Pillar on a Summit</title>
<meta name="description" content="The full cross-reference: every Ordnance Survey trig pillar within 250 metres of a named hill in Britain and Ireland.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Azeret+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#eaeee5;--panel:#e0e6d8;--ink:#1c211a;--ink2:#5d6a58;--rule:#c2cbb8;
  --rule2:#d4dccb;--accent:#a83527;--fix:#1c6b4a;
  --m:'Azeret Mono',ui-monospace,Menlo,monospace;--s:'Archivo',system-ui,sans-serif;}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#10150f;--panel:#18201a;--ink:#e0e7dc;--ink2:#8a9a86;--rule:#2c3629;
  --rule2:#1f2720;--accent:#e2695a;--fix:#48c08c;}}
:root[data-theme=dark]{--paper:#10150f;--panel:#18201a;--ink:#e0e7dc;--ink2:#8a9a86;
  --rule:#2c3629;--rule2:#1f2720;--accent:#e2695a;--fix:#48c08c;}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--s)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:2px solid var(--ink);padding:32px 0 12px;
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{font:700 1.7rem/1.1 var(--s);margin:0;letter-spacing:-.02em}
.back{font:500 11px/1 var(--m);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);text-decoration:none;margin-left:auto}
.ctl{display:flex;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:20px 0 0}
.ctl>*{font:500 13px/1 var(--m);padding:12px;border:0;background:var(--panel);
  color:var(--ink);min-width:0}
.ctl input{flex:1 1 200px}
.ctl select{cursor:pointer}
.ctl :focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.count{font:500 11px/1 var(--m);color:var(--ink2);letter-spacing:.06em;padding:14px 2px}
table{width:100%;border-collapse:collapse}
th{font:500 10px/1 var(--m);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);
  text-align:left;padding:10px 10px;border-bottom:1px solid var(--ink);
  position:sticky;top:0;background:var(--paper)}
td{padding:10px;border-bottom:1px solid var(--rule2);vertical-align:baseline}
tr:hover td{background:var(--panel)}
.nm{font-weight:600}
.gr{font:400 11px/1.5 var(--m);color:var(--ink2);display:block;margin-top:2px}
.d{font:700 13px/1 var(--m);font-variant-numeric:tabular-nums;white-space:nowrap}
.d.on{color:var(--fix)}
.pl{font:500 12.5px/1.4 var(--m)}
.ls{font:400 11px/1.6 var(--m);color:var(--ink2)}
.ls b{color:var(--accent)}
.more{font:500 12px/1 var(--m);letter-spacing:.12em;text-transform:uppercase;padding:14px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;
  width:100%;margin:18px 0 50px}
.more:hover{background:var(--ink);color:var(--paper)}
footer{border-top:1px solid var(--rule);padding:16px 0 50px;font:400 12px/1.7 var(--m);
  color:var(--ink2)}
a{color:var(--accent)}
@media(max-width:720px){
  thead{display:none} table,tbody,tr,td{display:block;width:100%}
  tr{padding:12px 0;border-bottom:1px solid var(--rule)} td{border:0;padding:1px 0}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Every pillar on a summit</h1>
  <a class="back" href="index.html">← back to the map</a>
</header>

<div class="ctl">
  <input type="search" id="q" placeholder="Search summit or pillar" autocomplete="off" aria-label="Search">
  <select id="ch" aria-label="Challenge"></select>
  <select id="dist" aria-label="Separation">
    <option value="10">On the summit — ≤10 m</option>
    <option value="50" selected>Within 50 m</option>
    <option value="250">Within 250 m</option>
  </select>
</div>
<div class="count" id="count">Loading…</div>

<table>
  <thead><tr><th style="width:30%">Summit</th><th style="width:11%">Apart</th>
    <th style="width:20%">Pillar</th><th>Also counts toward</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<button class="more" id="more" hidden>Show more</button>

<footer>
<p>DoBIH v18.6 (CC BY 4.0) · OS Complete Trig Archive (OGL). Contains OS data © Crown
copyright and database right 2026. Destroyed pillars excluded.</p>
</footer>
</div>
<script>
const STEP=60; let R=null,shown=STEP;
const el=i=>document.getElementById(i), nf=n=>n.toLocaleString('en-GB');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('rows.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{R=d;boot()});
function boot(){
  const keys=Object.keys(R.ch).sort((a,b)=>R.ch[a].n.localeCompare(R.ch[b].n));
  el('ch').innerHTML=keys.map(c=>`<option value="${c}">${R.ch[c].n}</option>`).join('');
  const want=location.hash.replace('#','');
  el('ch').value=R.ch[want]?want:'W';
  ['q','ch','dist'].forEach(i=>el(i).addEventListener('input',()=>{shown=STEP;draw()}));
  el('more').addEventListener('click',()=>{shown+=STEP;draw()});
  draw();
}
function draw(){
  const c=el('ch').value,md=+el('dist').value,q=el('q').value.trim().toLowerCase();
  const all=(R.ch[c]?.rows)||[];
  const f=all.filter(r=>r.d<=md&&(!q||r.h.toLowerCase().includes(q)||r.t.toLowerCase().includes(q)));
  el('count').textContent=`${nf(f.length)} of ${nf(all.length)} · ${R.ch[c].n} · within ${md} m`;
  el('rows').innerHTML=f.slice(0,shown).map(r=>`<tr>
    <td><span class="nm">${esc(r.h)}</span><span class="gr">${esc(r.g||'')} · ${r.m??'?'} m · ${esc(r.r||'')}</span></td>
    <td><span class="d${r.d<=10?' on':''}">${r.d} m</span></td>
    <td class="pl">${esc(r.t)}</td>
    <td class="ls"><b>${r.l.length}</b> ${r.l.map(k=>R.ln[k]||k).join(' · ')}</td></tr>`).join('')
    ||`<tr><td colspan="4" style="padding:26px 0;color:var(--ink2)">Nothing matches.</td></tr>`;
  const left=f.length-shown; el('more').hidden=left<=0;
  el('more').textContent=`Show ${Math.min(STEP,left)} more`;
}
</script>
</body>
</html>
